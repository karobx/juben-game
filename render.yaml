# Render Blueprint — 劇本遊戲全棧部署
# https://render.com/docs/blueprint-spec
#
# 部署後於 Dashboard → Environment 設定（至少一個繪圖金鑰）：
#   OPENAI_API_KEY 或 POLLINATIONS_API_KEY
#
# GoDaddy subdomain：Settings → Custom Domains → game.ange1a.com
# DNS：CNAME game → <your-service>.onrender.com

services:
  - type: web
    name: juben-game
    runtime: python
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: STORAGE_MODE
        value: local
      - key: IMAGE_PROVIDER
        value: auto
      # 於 Render Dashboard 手動加入（勿 commit 真實金鑰）：
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: POLLINATIONS_API_KEY
      #   sync: false
